# Just Enough Items is optional: its recipe categories are the only thing behind it, and the
# machines, recipes and the dedicated server work without it. The build targets 19.57.0.450, so
# that is the oldest version the categories can load into.
[[dependencies.industrialcore]]
modId = "jei"
type = "optional"
versionRange = "[19.57.0.450,)"
ordering = "AFTER"
side = "CLIENT"
