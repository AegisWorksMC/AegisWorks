description = '''
AegisWorks (Open Beta) — Next-generation sci-fi industrial automation & tactical equipment mod for Minecraft 1.21.1 (NeoForge).
Features a 4-branch 38-machine skill tree, water-cooled nuclear & singularity multiblock reactors,
infinite-scale quantum storage networking, Virtual Aegis powered armor with 3D AR HUD,
and four modular electric weapons.
